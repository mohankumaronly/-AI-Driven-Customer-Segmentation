<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Power BI Customer Dashboard</title>

    <link rel="stylesheet"
          href="/static/style.css">

    <style>

        .powerbi-page {
            width: 95%;
            margin: 30px auto;
        }

        .powerbi-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .powerbi-header h1 {
            margin-bottom: 10px;
        }

        .dashboard-container {
            width: 100%;
            min-height: 700px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .dashboard-message {
            margin-top: 250px;
            font-size: 20px;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            background: #2563eb;
            color: white;
        }

    </style>

</head>

<body>

    <div class="powerbi-page">

        <div class="powerbi-header">

            <h1>
                AI Customer Segmentation Dashboard
            </h1>

            <p>
                Interactive Power BI Customer Analytics
            </p>

        </div>


        <div class="dashboard-container">

            <div class="dashboard-message">

                <h2>
                    Power BI Dashboard
                </h2>

                <p>
                    Your Power BI dashboard will be displayed here.
                </p>

                <p>
                    AI customer segmentation has been completed successfully.
                </p>

                <a href="/" class="back-button">
                    ← Back to AI Platform
                </a>

            </div>

        </div>

    </div>

</body>

</html>
