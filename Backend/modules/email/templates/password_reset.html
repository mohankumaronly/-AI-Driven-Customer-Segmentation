<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #2c3e50;">Password Reset Request</h2>
    <p>Hello,</p>
    <p>We received a request to reset your password. Your password-reset code is:</p>
    <div style="background-color: #f4f6f8; padding: 16px; font-size: 28px; font-weight: bold; letter-spacing: 6px; text-align: center; border-radius: 6px; margin: 20px 0; color: #d93025;">
        {{ otp }}
    </div>
    <p>This code expires in <strong>5 minutes</strong>.</p>
    <p>If you did not request this change, you can safely ignore this email.</p>
</body>
</html>
